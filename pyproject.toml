[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supersonic-inlet-designer"
dynamic = ["version"]              # busemann.__version__ is the single source
description = "2D external-compression supersonic inlet design tool"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "ezdxf",
]

[project.optional-dependencies]
# PySide6-Essentials only (QtCore, QtGui, QtWidgets, QtSvg): no Addons in the Windows build
app = ["PySide6-Essentials>=6.10", "pyqtgraph>=0.13"]
dev = ["pytest", "pytest-qt", "build"]

[project.scripts]
inletdesign = "inletdesign.cli:main"
busemann = "busemann.app:main"

[tool.setuptools.dynamic]
version = {attr = "busemann.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
busemann = [
    "theme/*.tmpl",
    "resources/fonts/*.ttf",
    "resources/fonts/*.txt",
    "resources/icons/*.svg",
    "resources/data/*.json",
    "resources/explain/*.md",
    "resources/explain/*.json",
    "resources/licenses/*.txt",
    "resources/licenses/*.json",
    "resources/examples/*.dxf",
    "resources/brand/*.svg",
    "resources/brand/*.png",
    "resources/brand/*.ico",
]

[tool.pytest.ini_options]
addopts = "-m \"not perf and not ui\""
markers = [
    "gui: GUI smoke tests (pytest-qt); skipped when PySide6 or a display is unavailable",
    "perf: performance targets (median timings, generous limits)",
    "ui: user-visible-only GUI checks (text, pixel geometry, styling); CI runs these, local default does not",
]
